[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sleepscape"
version = "0.1.0"
description = "Personal sleep and bedroom environment observation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "garmin-connect-personal-api-python>=1,<2",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
sleepscape = "sleepscape.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sleepscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
